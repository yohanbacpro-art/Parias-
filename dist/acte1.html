<script>
/* ── moteur.js ── */
/* PARIAS — Acte I · le moteur
 * ═══════════════════════════════════════════════════════════════════════
 *
 * Conforme à design/narratif_v7/docs/SYSTEME_COMBAT_NARRATIF_V7.md.
 *
 *   POSITION → INTENTION → TEST → CONSÉQUENCE → NOUVELLE POSITION
 *
 * Le joueur choisit une **intention**, jamais un résultat. Le moteur la
 * confronte à ce que Yohan sait faire, à ce qu'il porte, à ce qu'il a déjà
 * cassé, au terrain et à l'adversaire — puis affiche une scène écrite pour le
 * degré obtenu.
 *
 * Cinq degrés, pas deux. La réussite coûteuse est le cœur du système : on
 * obtient ce qu'on voulait, et on le paie.
 * ═══════════════════════════════════════════════════════════════════════ */

/* ── L'aléa ────────────────────────────────────────────────────────────────
 * Deux dés à six faces moins sept : de −5 à +5, en cloche. Les extrêmes sont
 * rares. Le pack l'exige — « l'aléa ne doit jamais effacer une différence
 * énorme de niveau ». Un charretier ne tue pas Yohan sur un coup heureux. */
const de = n => 1 + Math.floor(Math.random() * n);
const alea = () => de(6) + de(6) - 7;

const DEGRES = [
  { id:'dominante',  min: 6, nom:"Domination",        note:"objectif atteint, et un avantage en plus" },
  { id:'nette',      min: 2, nom:"Réussite nette",    note:"objectif atteint" },
  { id:'couteuse',   min:-1, nom:"Réussite coûteuse", note:"objectif atteint — et vous le payez" },
  { id:'echec',      min:-5, nom:"Échec",             note:"position dégradée, la scène continue" },
  { id:'catastrophe',min:-99,nom:"Catastrophe",       note:"" },
];
const degreDeMarge = m => DEGRES.find(d => m >= d.min);

/* ── L'état ─────────────────────────────────────────────────────────────── */
const ETAT = {
  carac:{}, comp:{}, ressources:{},
  or:0, renom:0, suspicion:0,
  flags:new Set(),
  blessures:[],          // structurées : zone, type, gravité, fonction perdue…
  faits:[], portes:[],
  adaptation:{},         // manœuvres déjà servies, par adversaire
  gore:'intense',        // sobre · intense · extrême
  scene:null,
  melee:null,
  acte:{ saison:0, engagements:3, arcsFaits:[], arcsIgnores:[] },
};
const a = f => ETAT.flags.has(f);

/* ── Les blessures ─────────────────────────────────────────────────────────
 * Une blessure n'est pas un malus global. Elle a une zone, une fonction
 * perdue, et elle ne gêne que ce qu'elle gêne réellement : un avant-bras
 * ouvert n'empêche pas de mentir à un notaire. */
function blesser(b){
  if(ETAT.blessures.some(x => x.id === b.id)) return null;
  const blessure = Object.assign({
    gravite:2, douleur:2, saignement:0, fonction:[], traitement:null, cicatrice:null,
  }, b);
  ETAT.blessures.push(blessure);
  return blessure;
}

function malusDe(carac, comp){
  let m = 0;
  for(const b of ETAT.blessures){
    if(b.fonction.includes(carac) || b.fonction.includes(comp)) m += b.gravite;
    else if(b.douleur >= 3) m += 1;          // une douleur forte gêne tout
  }
  const sang = ETAT.ressources.sang;
  if(sang <= 40) m += 2;
  if(sang <= 20) m += 3;
  const end = ETAT.ressources.endurance;
  if(end <= 30) m += 1;
  if(end <= 10) m += 2;
  return m;
}

/* Le saignement se paie à chaque scène, pas à la fin du combat. */
function saigner(){
  const perte = ETAT.blessures.reduce((s, b) => s + (b.saignement || 0), 0);
  if(!perte) return null;
  ETAT.ressources.sang = Math.max(0, ETAT.ressources.sang - perte);
  return perte;
}

function soigner(id, comment){
  const b = ETAT.blessures.find(x => x.id === id);
  if(!b) return false;
  b.saignement = 0;
  b.traitement = comment || "pansé";
  b.gravite = Math.max(1, b.gravite - 1);
  return true;
}

/* ── L'adaptation adverse ──────────────────────────────────────────────────
 * « Répéter une manœuvre donne ADAPTATION +2, puis +4 à l'ennemi. »
 * Un adversaire intelligent apprend vos habitudes en trois échanges. */
function adaptationDe(adversaire, manoeuvre){
  if(!adversaire || !manoeuvre) return 0;
  const cle = adversaire + '/' + manoeuvre;
  const n = ETAT.adaptation[cle] || 0;
  return n === 0 ? 0 : (n === 1 ? 2 : 4);
}
function noterManoeuvre(adversaire, manoeuvre){
  if(!adversaire || !manoeuvre) return;
  const cle = adversaire + '/' + manoeuvre;
  ETAT.adaptation[cle] = (ETAT.adaptation[cle] || 0) + 1;
}

/* ── La résolution ─────────────────────────────────────────────────────────
 *   MARGE = caractéristique + compétence + équipement + situation
 *           − blessures − adaptation − difficulté + aléa                    */
/* `situation`, `equipement` et `dc` acceptent une fonction : ce que Yohan a
 * appris pendant l'enquête doit peser au moment du jet, pas au chargement du
 * fichier. Savoir qu'elle ne tourne pas à gauche vaut deux points. */
const val  = (x) => (typeof x === 'function' ? x() : (x || 0));
const val2 = (x) => (typeof x === 'function' ? x() : x);

function resoudre(t){
  const carac = ETAT.carac[t.carac] || 0;
  const comp  = t.comp ? (ETAT.comp[t.comp] || 0) : 0;
  const equip = val(t.equipement);
  const situ  = val(t.situation);
  const dc    = val(t.dc);
  const bless = malusDe(t.carac, t.comp);
  const adapt = adaptationDe(t.adversaire, t.manoeuvre);
  const d     = alea();
  const marge = carac + comp + equip + situ - bless - adapt - dc + d;
  noterManoeuvre(t.adversaire, t.manoeuvre);
  if(t.cout) depenser(t.cout);
  return { marge, degre: degreDeMarge(marge).id, detail:{ carac, comp, equip, situ, bless, adapt, d, dc } };
}

function depenser(c){
  for(const [k, n] of Object.entries(c))
    ETAT.ressources[k] = Math.max(0, Math.min(100, (ETAT.ressources[k] || 0) - n));
}

/* ── Le renom : ce que les témoins ont vu ──────────────────────────────────
 * Un exploit sans témoin ne compte pas. C'est toute la mécanique de l'acte :
 * on monte en se faisant voir, et se faire voir attire ceux qui cherchent un
 * Paria. Le silence est gratuit et ne mène nulle part. */
const TEMOINS = {
  aucun:   { f:0,    nom:"personne" },
  un:      { f:0.25, nom:"un homme" },
  quelques:{ f:0.55, nom:"quelques-uns" },
  foule:   { f:1,    nom:"toute une salle" },
  province:{ f:1.6,  nom:"la province entière" },
};

const RANGS = [
  { id:'inconnu',   seuil:0,  cri:"Nous cherchons un Paria",
    note:"Personne ne connaît votre nom. C'est confortable et ça ne paie rien." },
  { id:'nomme',     seuil:45, cri:"Nous cherchons Yohan",
    note:"On vous demande par votre nom. Les contrats montent, les questions aussi." },
  { id:'karlsberg', seuil:95, cri:"Nous cherchons Yohan de Karlsberg",
    note:"Le nom est ressorti. Ce qui vous cherche maintenant n'a plus rien d'un commanditaire." },
];
const rangActuel = () => RANGS.slice().reverse().find(r => ETAT.renom >= r.seuil) || RANGS[0];

/* Un exploit : un éclat, des témoins, et ce qu'on en dira. */
function exploit(e){
  const t = TEMOINS[val2(e.temoins)] || TEMOINS.aucun;
  const gagne = Math.round((e.eclat || 0) * t.f);
  const avant = rangActuel().id;
  ETAT.renom += gagne;
  if(e.suspicion) ETAT.suspicion = Math.min(100, ETAT.suspicion + Math.round(e.suspicion * (t.f || 0.2)));
  const monte = rangActuel().id !== avant;
  return { gagne, temoins:t, monte, rang:rangActuel(), quoi:e.quoi };
}

/* ── Le texte gradué ───────────────────────────────────────────────────────
 * Un paragraphe peut être écrit en trois intensités. Le détail change ; la
 * conséquence mécanique, jamais. */
/* Un peu de gras et d'italique, rien d'autre : le récit n'a pas besoin de plus. */
function md(t){
  return t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
}

function texteDe(p){
  if(typeof p === 'function') p = p();      // un paragraphe qui lit l'état
  if(!p) return '';
  if(typeof p === 'string') return p;
  return p[ETAT.gore] || p.intense || p.sobre || '';
}

/* ── Les effets d'une scène ou d'un choix ──────────────────────────────── */
function appliquer(e){
  if(!e) return [];
  const tags = [];
  const T = (cls, txt) => tags.push(`<span class="${cls}">${txt}</span>`);

  if(e.faire) e.faire();
  const or = val(e.or);
  if(or){ ETAT.or += or; T(or > 0 ? 'bien' : 'mal', `${or > 0 ? '+' : '−'}${Math.abs(or)} or`); }
  (e.flags || []).forEach(f => ETAT.flags.add(f));
  if(e.flag) ETAT.flags.add(e.flag);
  if(e.cout) depenser(e.cout);
  if(e.rendre) for(const [k, n] of Object.entries(e.rendre))
    ETAT.ressources[k] = Math.min(100, (ETAT.ressources[k] || 0) + n);

  if(e.blessure){
    const b = blesser(e.blessure);
    if(b) T('mal', `${b.zone} — ${b.type}`);
  }
  if(e.soigne && soigner(e.soigne.id, e.soigne.comment)) T('bien', "blessure pansée");

  if(e.exploit){
    const r = exploit(e.exploit);
    if(r.gagne > 0) T('renom', `+${r.gagne} renom · vu par ${r.temoins.nom}`);
    else T('rien', "personne n'a vu");
    if(r.monte) T('rang', `On dit désormais : « ${r.rang.cri} »`);
  }
  if(e.suspicion){ ETAT.suspicion = Math.min(100, ETAT.suspicion + e.suspicion); T('mal', `+${e.suspicion} suspicion`); }
  if(e.marque){ ETAT.faits.push(e.marque); T('marque', e.court || "inscrit au journal"); }
  if(e.melee) ETAT.melee = Object.assign({}, e.melee);
  if(e.meleeMaj && ETAT.melee) Object.assign(ETAT.melee, e.meleeMaj);
  (e.tags || []).forEach(x => T('', x));

  majBandeau();
  return tags;
}

/* ── Rendu ─────────────────────────────────────────────────────────────── */
let SCENES = {};
let dernierJet = null;

function enregistrerScenes(bloc){ Object.assign(SCENES, bloc); }

/* Scènes composées à l'ouverture : le tableau des mercenaires, le
 * basculement, les aiguillages qui lisent l'état de la partie. */
const DYN = {};

function aller(id){
  const s = SCENES[id];
  if(!s){ console.error('Scène absente :', id); return; }
  if(s.dyn && DYN[id]){ DYN[id](); return; }
  ETAT.scene = id;

  const perte = saigner();
  const el = document.getElementById('scene');
  let h = '';

  if(s.lieu)  h += `<p class="lieu">${s.lieu}</p>`;
  if(s.titre) h += `<h1>${s.titre}</h1>`;
  if(dernierJet){ h += dernierJet; dernierJet = null; }
  if(s.qui) h += vignette(s.qui);
  if(s.melee && ETAT.melee) h += barreMelee();

  const tags = appliquer(s.effets);
  if(perte) tags.push(`<span class="mal">−${perte} sang</span>`);
  if(tags.length) h += `<div class="effets">${tags.join('')}</div>`;

  h += (s.texte || []).map(texteDe).filter(Boolean).map(t =>
    t.startsWith('§') ? `<p class="souffle">${md(t.slice(1))}</p>` : `<p class="recit">${md(t)}</p>`
  ).join('');

  if(s.issue) h += blocIssue(s);

  const choix = (s.choix || []).filter(c => !c.si || c.si());
  if(choix.length){
    h += '<div class="choix">' + choix.map((c, i) => {
      const bloque = c.requisOr && ETAT.or < c.requisOr;
      const ferme = val2(c.ferme);
      return `<button data-i="${i}" class="${c.definitif ? 'definitif' : ''}"${
        c.risque ? ` data-risque="${c.risque}"` : ''}${bloque ? ' disabled' : ''}>
        <span class="ch-t">${c.t}</span>
        ${c.risque ? `<span class="ch-risque">${c.risque}</span>` : ''}
        ${c.detail ? `<span class="ch-detail">${bloque ? `Il vous manque ${c.requisOr - ETAT.or} or — ` : ''}${c.detail}</span>` : ''}
        ${ferme ? `<span class="ch-ferme">${ferme}</span>` : ''}
      </button>`;
    }).join('') + '</div>';
  } else if(s.suite){
    h += `<div class="suite"><button data-suite="1">${s.libelleSuite || 'Continuer'}</button></div>`;
  }

  el.innerHTML = h;
  window.scrollTo({ top:0, behavior:'instant' });

  el.querySelectorAll('.choix button:not([disabled])').forEach(b =>
    b.onclick = () => jouer(choix[+b.dataset.i]));
  const suiv = el.querySelector('[data-suite]');
  if(suiv) suiv.onclick = () => aller(s.suite);

  if(typeof sauver === 'function') sauver();
}

function jouer(c){
  if(c.avant) c.avant();
  appliquer(c.effets);
  const ferme = val2(c.ferme);
  if(ferme) ETAT.portes.push(ferme.replace(/^Ferme : /, ''));

  if(c.test){
    const r = resoudre(c.test);
    const d = DEGRES.find(x => x.id === r.degre);
    const NOMS = { force:'Force', agilite:'Agilité', endurance:'Endurance', perception:'Perception',
                   intellect:'Intellect', volonte:'Volonté', presence:'Présence' };
    const COMPS = { epees:'épées', dagues:'dagues', lutte:'lutte', armes_lourdes:'armes lourdes',
                    hast:"armes d'hast", tir:'tir', jet:'armes de jet', bouclier:'bouclier',
                    equitation:'équitation', anatomie:'anatomie', bestiaire:'bestiaire',
                    alchimie:'alchimie', furtivite:'furtivité', tactique:'tactique',
                    commandement:'commandement', onde:"maîtrise de l'Onde" };
    const parts = [`${NOMS[c.test.carac]} ${r.detail.carac}`];
    if(c.test.comp) parts.push(`${COMPS[c.test.comp] || c.test.comp} ${r.detail.comp}`);
    if(r.detail.equip) parts.push(`équipement ${r.detail.equip > 0 ? '+' : ''}${r.detail.equip}`);
    if(r.detail.situ)  parts.push(`terrain ${r.detail.situ > 0 ? '+' : ''}${r.detail.situ}`);
    if(r.detail.bless) parts.push(`blessures −${r.detail.bless}`);
    if(r.detail.adapt) parts.push(`il vous a lu −${r.detail.adapt}`);
    dernierJet = `<p class="jet ${r.degre}">${parts.join(' · ')} contre ${r.detail.dc}
      <b>${d.nom}</b>${d.note ? ` — ${d.note}` : ''}</p>`;
    aller(cible(c.degres, r.degre));
    return;
  }
  aller(c.va);
}

/* Une scène par degré, et un repli vers le voisin le plus proche : on n'oblige
 * pas l'auteur à écrire cinq issues là où trois suffisent. */
function cible(degres, obtenu){
  const ordre = ['dominante', 'nette', 'couteuse', 'echec', 'catastrophe'];
  const i = ordre.indexOf(obtenu);
  for(let d = 0; d < 5; d++){
    if(degres[ordre[i - d]]) return degres[ordre[i - d]];
    if(degres[ordre[i + d]]) return degres[ordre[i + d]];
  }
  return degres.nette || Object.values(degres)[0];
}

/* ── Habillage ─────────────────────────────────────────────────────────── */
function vignette(id){
  const g = GENS[id];
  if(!g) return '';
  return `<div class="qui"><div class="visage">${g.lettre}</div>
    <div><div class="nom">${g.nom}</div><div class="role">${g.role}</div></div></div>`;
}

function barreMelee(){
  const m = ETAT.melee;
  return `<div class="melee">
    ${m.eux !== undefined ? `<span>Debout en face · <b>${m.eux}</b></span>` : ''}
    ${m.position ? `<span>Position · <b>${m.position}</b></span>` : ''}
    ${m.note ? `<span>${m.note}</span>` : ''}</div>`;
}

function blocIssue(s){
  return `<div class="issue"><p class="etiquette">${s.issue}</p><h2>${s.bilan}</h2>
    ${(s.apres || []).map(texteDe).filter(Boolean).map(t => `<p class="recit">${md(t)}</p>`).join('')}
    ${s.plusTard ? `<div class="plus-tard"><p class="etiquette">Ce que ça coûtera</p><p>${s.plusTard}</p></div>` : ''}</div>`;
}

/* ── Le bandeau et le journal ──────────────────────────────────────────── */
function majBandeau(){
  const r = rangActuel();
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
  set('bRang', `« ${r.cri} »`);
  set('bOr', ETAT.or + ' or');
  set('bChair', etatDuCorps());
  const j = document.getElementById('journalCorps');
  if(!j) return;
  const liste = (titre, sous, items, cls, vide) =>
    `<h2>${titre}</h2><p class="sous">${sous}</p><ul>${items.length
      ? items.map(x => `<li class="${cls}">${x}</li>`).join('')
      : `<li class="vide">${vide}</li>`}</ul>`;

  j.innerHTML =
    `<h2>Ce que Yohan sait faire</h2><p class="sous">Échelle mortelle : 1 à 10</p>
     <div class="fiche">${Object.entries(ETAT.carac).map(([k, v]) =>
        `<span><i>${CARAC_NOMS[k]}</i><b>${v}</b></span>`).join('')}</div>
     <div class="fiche fiche-comp">${['epees','lutte','anatomie','bestiaire','tactique','onde','furtivite','jet']
        .map(k => `<span><i>${k === 'onde' ? "Onde" : k}</i><b>${ETAT.comp[k]}</b></span>`).join('')}</div>
     <div class="jauges">${Object.entries(ETAT.ressources).map(([k, v]) =>
        `<div class="jauge"><i>${k}</i><span style="width:${v}%"></span><b>${v}</b></div>`).join('')}</div>` +
    liste("Ce que vous portez", "Une blessure ne gêne que ce qu'elle gêne",
      ETAT.blessures.map(b => `<b>${b.zone}</b> — ${b.type}${b.fonction.length
        ? ` <i>(gêne : ${b.fonction.join(', ')})</i>` : ''}${b.saignement ? ` <u>saigne</u>` : ''}${
        b.traitement ? ` · ${b.traitement}` : ''}`), 'plaie', "Rien de cassé. Pour l'instant.") +
    liste("Ce que vous avez fait", "Rien ici ne se reprend", ETAT.faits, '', "La journée commence.") +
    liste("Ce que vous ne pouvez plus faire", "Les portes fermées", ETAT.portes, 'close',
      "Toutes les routes sont encore ouvertes.");
}

function etatDuCorps(){
  const n = ETAT.blessures.length;
  const sang = ETAT.ressources.sang;
  if(!n && sang > 90) return '';
  const mots = [];
  if(n) mots.push(n + (n > 1 ? ' plaies' : ' plaie'));
  if(sang <= 40) mots.push('vous perdez du sang');
  if(ETAT.ressources.endurance <= 30) mots.push('à bout de souffle');
  return mots.join(' · ');
}

const CARAC_NOMS = { force:'Force', agilite:'Agilité', endurance:'Endurance', perception:'Perception',
                     intellect:'Intellect', volonte:'Volonté', presence:'Présence' };

/* PARIAS — Acte I · ce qui fait de trois contrats un acte
 * ═══════════════════════════════════════════════════════════════════════
 *
 * Trois affaires écrites côte à côte font trois nouvelles. Il faut quatre
 * choses de plus pour que ça devienne un acte, et les voici :
 *
 *   1. LE RENOM PAIE ET COÛTE. Le rang change les sommes du tableau, la
 *      nature des clients, et finit par attirer autre chose que des clients.
 *   2. CE QU'ON N'A PAS PRIS REVIENT. Les affaires laissées sur le mur ne
 *      se règlent pas au basculement : elles vous croisent sur la route,
 *      pendant que vous êtes occupé ailleurs.
 *   3. LE CORPS NE SE RÉPARE PAS TOUT SEUL. Entre deux contrats il faut
 *      décider quoi faire de ce qu'on porte, et chaque façon coûte quelque
 *      chose de différent.
 *   4. KARLSBERG A UN SECOND BATTEMENT. Ce qu'on a fait de la borne revient
 *      dire ce que ça vaut.
 *
 * L'entre-saisons draine ces quatre files, une scène à la fois, puis rend
 * la main au tableau des mercenaires.
 * ═══════════════════════════════════════════════════════════════════════ */

/* ── 1 · Le renom paie ─────────────────────────────────────────────────────
 * Un homme qu'on demande par son nom ne se négocie pas au tarif d'un homme
 * qu'on ne connaît pas. C'est la seule récompense mécanique du renom — et
 * elle vient avec tout le reste, qui n'est pas une récompense. */
const PRIME = { inconnu:1, nomme:1.4, karlsberg:1.8 };
const prime = n => Math.round(n * PRIME[rangActuel().id]);

/* ── 3 · Le corps ──────────────────────────────────────────────────────────
 * Une blessure ne disparaît pas : elle descend d'un cran, ou elle reste. */
function reposer(crans){
  const soignees = [];
  for(const b of ETAT.blessures){
    b.saignement = 0;
    b.gravite = b.gravite - crans;
    b.douleur = Math.max(0, b.douleur - crans);
    if(b.gravite <= 0) soignees.push(b);
    else b.traitement = b.traitement || "refermé";
  }
  /* Ce qui est refermé quitte la liste — mais la cicatrice reste au journal. */
  for(const b of soignees){
    ETAT.blessures.splice(ETAT.blessures.indexOf(b), 1);
    if(b.cicatrice) ETAT.faits.push(`${b.zone} — refermé. Reste : ${b.cicatrice}.`);
  }
  return soignees.length;
}

function rendreSouffle(n){
  for(const k of ['vitalite', 'endurance', 'concentration', 'sang', 'moral'])
    ETAT.ressources[k] = Math.min(100, (ETAT.ressources[k] || 0) + n);
}

/* ── L'entre-saisons ───────────────────────────────────────────────────────
 * Quatre files vidées dans l'ordre. Chaque scène y revient quand elle a fini,
 * et quand tout est vide on rend la main au tableau. */
function prochaineDeLEntreSaison(){
  const A = ETAT.acte;

  /* a) Ce qu'on n'a pas pris, et qui n'a pas encore fait signe. */
  if(A.saison >= 2){
    const echo = AFFAIRES.find(x =>
      !A.arcsFaits.includes(x.id) && ECHOS[x.id] && !a('echo_' + x.id));
    if(echo) return 'echo_' + echo.id;
  }

  /* b) Le second battement Karlsberg — une fois, s'il est armé. */
  if(!a('karlsberg_2')){
    const k = BATTEMENT_KARLSBERG.find(x => x.si());
    if(k) return k.scene;
  }

  /* c) Le palier de renom qu'on vient de franchir. */
  const r = rangActuel().id;
  if(r !== 'inconnu' && !a('palier_' + r)) return 'palier_' + r;

  /* d) L'entre-deux : le corps, l'argent, et ce qu'on décide d'en faire. */
  if(!a('soins_' + A.saison)) return 'convalescence';

  return null;
}

DYN.entre_saisons = () => {
  const suivante = prochaineDeLEntreSaison();
  if(suivante) aller(suivante);

/* S'arrêter six semaines coûte l'affaire la mieux payée du mur. Jamais la
 * dernière : on ne ferme pas la seule porte qui reste. */
function perdreUneAffaire(){
  const A = ETAT.acte;
  const libres = AFFAIRES.filter(x =>
    !A.arcsFaits.includes(x.id) && !A.arcsPerdus.includes(x.id));
  const reste = A.engagements - A.arcsFaits.length;
  if(libres.length <= Math.max(1, reste)) return null;
  const perdue = libres.slice().sort((x, y) => y.or - x.or)[0];
  A.arcsPerdus.push(perdue.id);
  ETAT.faits.push(`${perdue.titre} — décrochée du mur pendant que vous vous remettiez.`);
  return perdue;
}

      intense:"Sur les vires, à mi-hauteur, il y a des carcasses. Deux chevaux, un mulet, quelque chose de plus petit qu'on ne veut pas identifier. Elles ne sont pas tombées là : elles ont été posées, calées entre les rochers, et elles sèchent.",
      extreme:"Sur les vires, à mi-hauteur, il y a des carcasses calées entre les rochers, éventrées et vidées, la peau tannée par six semaines de gel et de vent. Deux chevaux. Un mulet. Et une chose plus petite dont il reste assez de tissu bleu pour qu'on sache que ce n'était pas un animal." },
    "Un garde-manger. Les wyvernes en font quand elles ont quelque chose à nourrir et pas le temps de chasser tous les jours.",
    "§ Cent quarante pieds au-dessus, dans une anfractuosité de la falaise, il y a le nid — et le nid est bâti autour d'une borne.",
    "Une vraie borne, taillée, ancienne, avec une face plate et des marques dessus. Une wyverne ne bâtit pas autour d'une pierre par hasard : elle bâtit autour de ce qui garde la chaleur du soleil le plus longtemps.",
    "En bas, au pied de la falaise, un homme et six autres montent deux balistes de campagne sous un couvert de branchages. L'homme a trois doigts à la main gauche et il vous voit arriver bien avant que vous le voyiez.",
  ],
  suite:'wy_bracq', libelleSuite:"L'homme aux balistes",
},

wy_bracq_dom:{
  qui:'bracq',
  texte:[
    "Il se marre. C'est un rire court et sans joie, celui d'un homme à qui l'on vient de poser exactement la question qu'il attendait depuis six semaines.",
    "« Enfin quelqu'un. »",
    "Il vous emmène derrière la baliste de gauche et sort d'une caisse un carreau qu'il a manifestement gardé pour ça.",
    "« Retiré de l'aile gauche à la première caravane. Elle l'a fait tomber en volant et un charretier l'a ramassé. »",
    "C'est un carreau de baliste de campagne. Pas une flèche de chasse. Pas un trait d'arbalète de braconnier. Une pointe carrée de quatre pouces, à empennage de cuir, poinçonnée sous la douille.",
    "« Poinçon de l'arsenal de Chastel, série de l'an dernier. Il y a exactement deux engins de ce calibre dans cette vallée et je les ai montés tous les deux. »",
    "§ « Ceux-là. Ceux que je viens de tendre. »",
    "Il repose le carreau dans la caisse et il n'a plus du tout envie de rire.",
    "« Quelqu'un a sorti une de mes balistes à l'automne, l'a montée quelque part sur le versant nord, a tiré sur une bête qui mangeait des moutons et ne descendait pas, l'a blessée, et l'a remontée dans son râtelier avant que je m'en aperçoive. »",
    "« Il y a trois hommes dans cette vallée qui savent tendre un de ces engins. Moi, et deux de mes servants. Et mes deux servants étaient à Chastel en octobre. »",
  ],
  effets:{ flags:['wy_sait_fleches','wy_sait_baliste','wy_bracq_allie'],
           exploit:{ eclat:4, temoins:'quelques', quoi:"vous avez posé la question que personne n'osait" },
           marque:"Le carreau retiré de l'aile vient d'une baliste de Valombre, tirée à l'automne.", court:"Une baliste de la maison" },
  suite:'wy_bracq', libelleSuite:"Revenir aux balistes",
},

wy_bracq_ok:{
  qui:'bracq',
  texte:[
    "« On a retiré un carreau de son aile gauche à la première caravane. Un carreau, pas une flèche. »",
    "Il vous montre la caisse mais ne l'ouvre pas.",
    "« Militaire. Poinçonné. Je ne vous dirai pas de quel arsenal parce que je tiens à ma place et à mes trois doigts. »",
    "§ « Mais posez-vous la question suivante, messire, et posez-la à quelqu'un d'autre que moi : qui, dans une vallée de bergers, a de quoi tirer un carreau de baliste sur une bête à cent pieds ? »",
  ],
  effets:{ flags:['wy_sait_fleches','wy_sait_baliste'],
           marque:"Le carreau retiré de l'aile est militaire et poinçonné.", court:"Un carreau militaire" },
  suite:'wy_bracq', libelleSuite:"Revenir aux balistes",
},

wy_bracq_ko:{
  qui:'bracq',
  texte:[
    "« Je monte des engins. Je ne monte pas des dossiers. »",
    "Il retourne à sa baliste et se met à graisser une glissière qui n'en a aucun besoin, ce qui est la manière la plus universellement comprise de mettre fin à une conversation.",
    "§ Il n'a pas dit non. Il a dit *pas à vous, pas maintenant*, ce qui n'est pas la même chose.",
  ],
  suite:'wy_bracq', libelleSuite:"Revenir aux balistes",
},

wy_vires_dom:{
  texte:[
    "Il faut deux heures et une corde pour atteindre la première vire, et l'odeur monte bien avant qu'on y soit.",
    { sobre:"Les carcasses ne sont pas mangées de la même façon.",
      intense:"Les carcasses ne sont pas mangées de la même façon, et c'est là tout le renseignement. Sur les deux chevaux, les grandes masses musculaires — cuisses, encolure — ont été arrachées par bandes larges. Sur le mulet, non : il a été ouvert, et l'intérieur a été vidé proprement, sans que la carcasse soit entamée ailleurs.",
      extreme:"Les carcasses ne sont pas mangées de la même façon, et c'est là tout le renseignement. Sur les deux chevaux, les grandes masses — cuisses, encolure — ont été arrachées par bandes larges, l'os raclé jusqu'au blanc. Sur le mulet, non : il a été ouvert du poitrail à l'aine, le foie, les poumons et les intestins prélevés, et le reste laissé intact à sécher." },
    "Une adulte mange le muscle. Les organes mous, on les donne à ce qui n'a pas encore de dents.",
    "§ Il y a autre chose de vivant là-haut, et ça mange depuis au moins trois semaines.",
    "Sur la vire, en revenant, vous trouvez encore deux choses. Une coquille — un fragment large comme une main, épais comme un ongle de pouce, nacré à l'intérieur : une éclosion, pas une casse. Et, coincé sous une pierre, un morceau de laine cardée.",
    "De la laine cardée. Pas de la toison brute. De la laine préparée, du genre qu'on met dans une caisse pour transporter quelque chose de fragile.",
    "Quelqu'un est déjà monté à ce nid.",
  ],
  effets:{ flags:['wy_sait_couvee','wy_sait_laine','wy_deja_monte'],
           exploit:{ eclat:5, temoins:'quelques', quoi:"vous êtes monté aux vires" },
           marque:"Une éclosion a déjà eu lieu, et quelqu'un est monté au nid avec de la laine cardée.", court:"Quelqu'un est monté" },
  suite:'wy_bracq', libelleSuite:"Redescendre",
},

wy_vires_ok:{
  texte:[
    "Deux heures, une corde, et l'odeur.",

      intense:"Les deux chevaux ont été mangés au muscle — cuisses et encolure arrachées par bandes. Le mulet, lui, a été ouvert et vidé de ses organes mous, et le reste laissé à sécher.",

    "§ On donne les organes mous à ce qui n'a pas de dents.",

  effets:{ flags:['wy_sait_couvee'],

wy_vires_ko:{
  texte:[
    "Vous montez à la première vire et vous n'y restez pas longtemps. Le vent tourne, l'odeur devient impossible, et le schiste part sous les mains par plaques de la taille d'une assiette.",
    "Vous redescendez avec deux paumes râpées et la seule information dont tout le monde disposait déjà : c'est une grosse bête et elle mange beaucoup.",
  ],
  effets:{ cout:{ endurance:8 } },
  suite:'wy_bracq', libelleSuite:"Redescendre" },

wy_nid_reco_dom:{
  texte:[
    "Cent quarante pieds de schiste, en février, sans corde sur les quarante derniers parce qu'il n'y a rien où l'amarrer.",
    "Vous montez par la cheminée est, dans l'ombre, du côté où le vent rabat votre odeur vers la rivière. Il vous faut une heure et demie et vous arrivez à trente pieds sous le nid, sur une vire de deux pouces, avec une vue complète.",
    "Le nid fait douze pieds de large. Il est bâti autour de la borne — et la borne est un jalon de route impérial, taillé, à quatre faces, gravé sur trois.",
    "§ Sur la face exposée au sud, sous quarante ans de fiente et de lichen, il y a un loup.",
    "Pas un loup héraldique. Un loup ancien, à la gueule fermée, encadré de deux barres — la marque de bornage des routes de la maison Karlsberg.",
    "Cette route était à votre famille. Il y a dix-neuf ans, on a gratté les pierres. On a manifestement oublié celle-là parce qu'elle est à cent quarante pieds et que personne n'y monte.",
    "Il vous faut un moment.",
    "Puis vous regardez le nid, parce que c'est pour ça que vous êtes monté.",
    "Trois œufs. Gris, mouchetés, gros comme des têtes d'enfant, calés contre la face sud de la borne — la face qui garde le soleil.",
    "Et une quatrième forme. Plus petite, immobile, la peau des ailes encore translucide : un jeune éclos, mort depuis plusieurs jours, que la mère n'a pas mangé et n'a pas jeté.",
  ],
  effets:{ flags:['wy_sait_couvee','wy_borne_karlsberg','wy_reco_nid','wy_jeune_mort'],
           exploit:{ eclat:6, temoins:'quelques', quoi:"vous êtes monté au nid, seul, de nuit" },
           cout:{ endurance:10 },
           marque:"La borne du nid porte le loup de Karlsberg. Cette route était à votre famille.", court:"Le loup sur la borne" },
  suite:'wy_bracq', libelleSuite:"Redescendre" },

    "Vous montez, et à quatre-vingts pieds une plaque de schiste de la taille d'une porte se détache sous votre pied gauche.",

    { sobre:"Vous vous rétablissez. L'épaule droite n'est plus tout à fait à sa place.",

      extreme:"Vous vous rétablissez à la force d'un bras. L'épaule droite fait un bruit mouillé qu'on entend de l'intérieur du crâne, la tête humérale sort et rentre sous la peau, et pendant six secondes le bras entier ne répond plus du tout." },
    "Vous voyez le nid quand même. Trois œufs, gris, calés contre une borne ancienne.",

  suite:'wy_bracq', libelleSuite:"Redescendre" },

wy_nid_reco_ko:{
  texte:[
    "Vous montez soixante pieds et vous vous arrêtez.",
    "Ce n'est pas la peur : c'est le calcul. Au-dessus, le schiste devient une pente d'ardoises empilées qui bougent quand on les regarde, il fait nuit dans une heure, et il n'y a pas un seul point d'amarrage sur les quatre-vingts pieds restants.",
    "§ Il y a un âge où l'on redescend, et c'est en général l'âge où l'on est encore vivant.",

    "Vous tombez douze pieds sur une vire en pente, vous rebondissez, et vous vous arrêtez parce qu'un ressaut de schiste vous prend en travers du flanc.",
    { sobre:"Deux côtes cèdent. Vous restez sur cette vire vingt minutes avant de pouvoir vous relever.",

      extreme:"Deux côtes cèdent du côté gauche avec un bruit sec de branche verte, et la troisième s'enfonce vers l'intérieur. Le goût qui monte dans la bouche est celui du fer. Vous restez sur cette vire vingt minutes, à quatre-vingts pieds au-dessus du gué, à cracher rouge dans la neige en essayant de reprendre un souffle qui ne revient que par tiers." },

/* ══ LE RELAIS DE SEL ═══════════════════════════════════════════════════ */
wy_gassien:{
  lieu:"Bas du gué · le relais de sel · trois lieues plus bas",
  titre:"Le Lièvre",
  qui:'gassien',
  texte:[
    "Le relais de sel du bas du gué est une baraque de planches et un enclos, avec onze mules, quatre hommes, et beaucoup plus de sel que n'en justifie une baraque de planches.",
    "Gassien le Lièvre a quarante ans, un manteau de bonne coupe sur des bottes de charretier, et cette façon de vous voir arriver depuis quatre cents pas sans jamais lever la tête de ce qu'il fait.",
    "« Le Paria de Valombre. »",
    "Il se redresse enfin, s'essuie les mains, et sourit — un vrai sourire, chaleureux, et absolument sans rapport avec ce qui se passe derrière ses yeux.",
    "« On m'a dit que vous montiez. Vous voulez du sel ? Personne ne veut jamais de sel et pourtant tout le monde en achète. »",
    "§ Derrière lui, sur la table de l'enclos, il y a deux caisses ouvertes. Elles sont garnies de laine cardée.",
  ],
  choix:[
    { t:"« Vous rabattez les caravanes sous le nid. »",
      detail:"Volonté — l'accusation, à froid, sans preuve, en le regardant",
      risque:"risqué",
      test:{ carac:'volonte', comp:null, dc:13, manoeuvre:'accusation', adversaire:'gassien' },
      degres:{ dominante:'wy_gassien_dom', nette:'wy_gassien_ok', couteuse:'wy_gassien_cout',
               echec:'wy_gassien_ko', catastrophe:'wy_gassien_cata' } },
    { t:"Poser le relevé du péage sur la table",
      detail:"Son sel passe gratuitement depuis l'automne · et il n'y a qu'une explication",
      si:() => a('wy_releve_peage'),
      risque:"favorable", va:'wy_gassien_dom',
      effets:{ flags:['wy_gassien_confondu'] } },
    { t:"Lui parler de la laine cardée",
      detail:"Perception — deux caisses garnies, dans un relais de sel",
      si:() => a('wy_sait_laine'),
      risque:"favorable",
      test:{ carac:'perception', comp:null, dc:10, manoeuvre:'laine', adversaire:'gassien' },
      degres:{ dominante:'wy_gassien_dom', nette:'wy_gassien_ok', echec:'wy_gassien_ko' } },
    { t:"Ne rien dire, tout regarder, et repartir",
      detail:"On ne prévient pas un homme qu'on a compris",
      va:'wy_prepa',

               marque:"Vous avez vu les caisses de laine chez Gassien et vous n'avez rien dit.", court:"Rien dit" } },

wy_gassien_dom:{
  qui:'gassien',
  texte:[
    "Il ne nie pas. C'est la première surprise.",
    "« Trois caravanes. » Il se rassied sur la caisse et croise les mains. « Vous voulez les chiffres exacts ou la version courte ? »",
    "« Les chiffres. »",
    "« Quatorze morts, pas onze — la maison de Valombre en compte onze parce que trois n'étaient pas déclarés au péage et qu'un mort non déclaré coûte moins cher qu'un mort déclaré. »",
    "Il dit ça sans la moindre gêne, du ton d'un homme qui corrige une erreur de comptabilité.",
    "« Ce que je fais : je tiens le relais du bas. Les caravanes s'arrêtent chez moi, je leur dis que la route est libre, et je leur conseille de partir à la troisième heure. La bête chasse à la troisième heure. »",
    "§ « Je ne les tue pas, messire. Je les renseigne mal. C'est très différent devant un juge, et j'ai vérifié. »",
    "« Et pourquoi ? »",
    "« Parce qu'une bête qui a mangé revient au nid et y reste douze heures. Parce que pendant ces douze heures, on peut monter. Et parce que la seule fois où l'on est monté sans qu'elle ait mangé, j'ai perdu deux hommes et une main sur trois. »",
    "Il montre l'enclos, les caisses de laine, les onze mules.",
    "« Un œuf sorti vivant du nid vaut mille couronnes à Port-Noir. J'en ai déjà sorti un à l'automne, avant que la maison s'en mêle. Il en reste trois. »",
    "« Le fils de Valombre a mis six semaines à comprendre ce que je faisais, et trois jours à demander sa part. »",
  ],
  effets:{ flags:['wy_verite','wy_gassien_avoue','wy_amaury_complice'],
           exploit:{ eclat:6, temoins:'un', quoi:"vous avez fait avouer Gassien le Lièvre" },
           marque:"Gassien rabat les caravanes sous le nid pour vider les œufs pendant que la bête digère. Amaury est de moitié.", court:"La vérité" },
  suite:'wy_gassien_choix',
},

wy_gassien_ok:{
  qui:'gassien',
  texte:[
    "Le sourire tient trois secondes de trop, ce qui, chez un homme qui sourit aussi bien, revient à s'effondrer.",
    "« Vous avez de l'imagination. »",
    "« J'ai deux caisses de laine cardée sur votre table et un relais de sel qui ne vend pas de sel. »",
    "Il regarde les caisses. Il regarde la baraque. Il calcule ce qu'il peut encore nier et il arrive au bon résultat.",
    "« On monte pendant qu'elle digère. Douze heures après un repas, elle ne bouge plus du nid mais elle ne voit plus rien non plus. »",
    "§ « Je ne tue personne, messire. Je conseille mal les départs. Nuance juridique, et je l'ai fait vérifier. »",
    "Il ne dit rien d'Amaury. Vous savez qu'il y a un et il ne dit rien.",
  ],
  effets:{ flags:['wy_verite','wy_gassien_avoue'],
           exploit:{ eclat:4, temoins:'un', quoi:"vous avez fait plier Gassien" },
           marque:"Gassien avoue rabattre les caravanes pour vider le nid pendant la digestion.", court:"Il avoue" },
  suite:'wy_gassien_choix',
},

wy_gassien_cout:{
  qui:'gassien',
  texte:[
    "Il avoue. Il avoue même vite, et beaucoup, et c'est précisément le problème : un homme qui avoue en quatre minutes ce qu'il cache depuis six mois est un homme qui a déjà décidé de la suite.",

 *
 * Elle a désormais vu ce que vous savez faire. Rejouer la même manœuvre coûte

/* Ce qu'elle a perdu au premier échange pèse sur sa difficulté. */

  - (a('wy_aile_ouverte') ? 2 : 0)
  - (a('wy_jarret') ? 3 : 0)
  - (a('wy_jarret_moitie') ? 1 : 0)
  - (a('wy_gorge_ouverte') ? 3 : 0)
  - (a('wy_grise_brisee') ? 2 : 0)
  - (a('wy_avantage_poison') ? 1 : 0)
  + (a('wy_desarme') ? 3 : 0)

/* PARIAS — Acte I · C03 · L'HÉRITIER DISPARU
 * ═══════════════════════════════════════════════════════════════════════
 * Le verbe de cet arc est DESCENDRE.

 * ═══════════════════════════════════════════════════════════════════════ */

/* ── Le fond ───────────────────────────────────────────────────────────────
 * Trois grandeurs, et une seule compte vraiment : l'air. On descend en les
 * dépensant, et rien de ce qu'on dépense ne se regagne. */
const fond = () => (ETAT.acte.mine = ETAT.acte.mine || { air:100, eau:0, niveau:0 });
const descendre = (dAir, dEau) => {
  const m = fond();
  m.air = Math.max(0, m.air - (dAir || 0));
  m.eau = Math.min(100, m.eau + (dEau || 0));
  m.niveau += 1;
};
const barreFond = () => {
  const m = fond();
  return { position:`niveau ${m.niveau}`, note:`Air ${m.air} · eau ${m.eau}` };
};

  const m = fond();

};

as_vasque:{

    { sobre:"Il a l'air content. C'est la première fois qu'on lui pose la question.",
      intense:"Il a l'air content, et c'est terrible : c'est la première fois depuis longtemps qu'on lui pose une question qui l'intéresse, et il va y répondre honnêtement parce qu'un homme de quarante-quatre ans qui aime son métier ne résiste jamais à ça.",
      extreme:"Il a l'air sincèrement content. C'est la première fois depuis longtemps qu'on lui pose une question qui l'intéresse, et il va y répondre honnêtement — un homme de quarante-quatre ans qui aime son métier ne résiste jamais à ça, et Ancelin Vasque aime son métier comme un charpentier aime le bois." },
    "« La cause, messire, c'est le répertoire. Pas les gens : le répertoire. »",
    "Il pose ses lunettes sur la table, verres en l'air, à côté d'un pot de graisse d'oie qui n'a rien à faire là.",
    "« Une maison n'est pas des gens. Une maison est une inscription. Les gens meurent, se marient, s'exilent, changent de nom — l'inscription, elle, dit ce qui est. Tant qu'une inscription est propre, la province tient : on sait à qui est le gué, à qui est le quart du sel, qui doit quoi à qui. »",
    "« Et quand elle ne l'est pas ? »",
    "§ « Alors on a une province où deux hommes peuvent produire deux titres sur la même pierre. Vous savez comment ça s'appelle ? Ça s'appelle la guerre, et ça dure vingt ans. »",
    "« On a rayé la maison Karlsberg. »",
    "Il ne bronche pas. Il ne bronche pas *du tout*, ce qui vous apprend en une demi-seconde qu'il a passé six jours en chariot à préparer précisément cette conversation avec quelqu'un — pas forcément vous, mais quelqu'un.",

    "« Je n'ai pas rayé cette ligne, messire. J'avais vingt-cinq ans et j'étais aux annexes. Je passe depuis onze ans à essayer de savoir qui l'a fait, et le jour où je le saurai, la personne en question aura commis un crime beaucoup plus grave que tout ce qui se juge dans cette salle. »",
    "« Alors pourquoi le tabouret ? »",
    { sobre:"« Parce que je ne peux pas descendre ici avec deux chariots de registres sans motif public. »",
      intense:"« Parce qu'un commissaire aux titres ne descend pas dans une vallée fermée, en hiver, avec deux chariots de répertoire et trente hommes, sans un motif public. Il me faut une cause. J'en ai pris une petite. »",
      extreme:"« Parce qu'un commissaire aux titres ne descend pas dans une vallée fermée, en hiver, avec deux chariots de répertoire et trente hommes, sans motif public. Il me faut une cause au rôle. J'en ai pris la plus petite que j'ai trouvée — et j'ai bien conscience, messire, de ce que ce mot recouvre quand la plus petite cause disponible est un garçon de quinze ans. »" },
    "§ « Je ne suis pas un homme cruel. Je suis un homme qui a besoin d'un motif au rôle. C'est pire et je le sais. »",
    "Il remet ses lunettes.",
    "« Cela dit — si quelqu'un se levait dans cette salle pour contester la cause, il me faudrait bien l'entendre. Et pour l'entendre, il me faudrait bien l'inscrire au rôle. »",
    "« Sous quel nom ? »",
    "« C'est la question, n'est-ce pas. »",

  effets:{ flags:['as_vasque','as_sait_vasque','sans_ordonnance'], suspicion:14,

DYN.as_rond_temps = () => {
  const A = ETAT.acte;
  if(bord() >= 3) return aller('as_forfait');
  A.passe = (A.passe || 0) + 1;
  if(A.passe === 1){ prendreTemps(); return aller('as_temps_1'); }
  if(A.passe === 2){ prendreTemps(); return aller('as_temps_2'); }
  return aller('as_rond_3');
};

<script>
/* ── jeu.js ── */
/* PARIAS — Acte I · la partie
 * ═══════════════════════════════════════════════════════════════════════
 * Sauvegarde unique, journal, réglage du détail, démarrage.
 * Rien ici ne décide de quoi que ce soit : c'est de la plomberie.
 * ═══════════════════════════════════════════════════════════════════════ */

const CLE = 'parias.acte1.v1';

function sauver(){
  try{
    localStorage.setItem(CLE, JSON.stringify({
      carac:ETAT.carac, comp:ETAT.comp, ressources:ETAT.ressources,
      or:ETAT.or, renom:ETAT.renom, suspicion:ETAT.suspicion,
      flags:[...ETAT.flags], blessures:ETAT.blessures,
      faits:ETAT.faits, portes:ETAT.portes, adaptation:ETAT.adaptation,
      gore:ETAT.gore, scene:ETAT.scene, melee:ETAT.melee, acte:ETAT.acte,
    }));
  }catch(e){ /* navigation privée, quota, tout ça : on joue quand même */ }
}

function charger(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(CLE) || 'null'); }catch(e){ return false; }
  if(!d || !d.scene) return false;
  Object.assign(ETAT, d, { flags:new Set(d.flags || []) });
  return true;
}

function effacer(){
  try{ localStorage.removeItem(CLE); }catch(e){}
}

/* ── Le journal ─────────────────────────────────────────────────────────── */
function basculerJournal(ouvrir){
  const j = document.getElementById('journal');
  const veut = ouvrir === undefined ? !j.classList.contains('ouvert') : ouvrir;
  j.classList.toggle('ouvert', veut);
  document.getElementById('bJournal').setAttribute('aria-expanded', String(veut));
  if(veut) majBandeau();
}

/* ── Le détail ──────────────────────────────────────────────────────────── */
const GORES = ['sobre', 'intense', 'extreme'];
const GORE_NOMS = { sobre:"sobre", intense:"intense", extreme:"extrême" };

function reglerGore(g){
  ETAT.gore = g;
  document.querySelectorAll('#gore button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.g === g)));
  sauver();
  if(ETAT.scene) aller(ETAT.scene);      // la scène se réécrit dans le nouveau registre
}

/* ── Démarrage ──────────────────────────────────────────────────────────── */
function nouvelle(){
  effacer();
  neuf();
  ETAT.gore = document.querySelector('#gore [aria-pressed="true"]')?.dataset.g || 'intense';
  majBandeau();
  aller('prologue');
}

function demarrer(){
  document.getElementById('bJournal').onclick = () => basculerJournal();
  document.getElementById('jFermer').onclick  = () => basculerJournal(false);
  document.getElementById('bNeuf').onclick    = () => {
    if(confirm("Recommencer efface la partie en cours. Rien ne se récupère.")) nouvelle();
  };
  document.querySelectorAll('#gore button').forEach(b =>
    b.onclick = () => reglerGore(b.dataset.g));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') basculerJournal(false); });

  if(charger()){
    document.querySelectorAll('#gore button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.g === ETAT.gore)));
    majBandeau();
    aller(ETAT.scene);
  }else{
    nouvelle();
  }
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
else demarrer();

</script>
